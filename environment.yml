name: xradar-dev
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python >=3.13,<3.15
  - pydata-sphinx-theme
  - pip
  - cffconvert
  - myst-parser
  - sphinx
  - sphinx-copybutton
  - sphinx-favicon
  - ipykernel
  - jupytext
  - h5netcdf
  - h5py
  - lat_lon_parser
  - netCDF4
  - open-radar-data>=0.9.0
  - pyproj
  - pip:
    - xarray >= 2026.4.0
  - xmltodict
  - cartopy
  - cmweather
  - dask
  - matplotlib-base
  - scipy
  - boto3
  - arm_pyart
  - wradlib
  - ffmpeg
  - zarr
  - pytest-xdist
  - pytest-cov
  - pre-commit
  - diff-cover
  - myst-nb
  - sphinx-copybutton
  - linkify-it-py
