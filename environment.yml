name: xradar-dev
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python >=3.10,<3.14
  - pydata-sphinx-theme
  - pip
  - cffconvert
  - myst-parser
  - sphinx
  - sphinx-copybutton
  - sphinx-favicon
  - ipykernel
  - h5netcdf
  - h5py
  - lat_lon_parser
  - netCDF4
  - open-radar-data>=0.8.0
  - pyproj
  - pip:
    - xarray >= 2026.4.0
    # docs build executes IRIS_Virtual.md and resolves IrisParser;
    # pip, not conda: obspec-utils (virtualizarr dep) has no conda-forge pkg
    - virtualizarr>=2.7.1,<2.8; python_version >= "3.12"
  - xmltodict
  - cartopy
  - cmweather
  - dask
  - matplotlib-base
  - scipy
  - boto3
  - arm_pyart
  - wradlib
  - ffmpeg
  - zarr>=3.1.6
  - pytest-xdist
  - pytest-cov
  - pre-commit
  - diff-cover
  - myst-nb
  - sphinx-copybutton
  - linkify-it-py
